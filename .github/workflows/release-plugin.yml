name: Build and release Concat
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (empty builds main only)
        default: ''
      publish_market:
        description: Publish verified packages to GitHub and marketplace
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: concat-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        target: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config nasm yasm gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - uses: actions/cache@v4
        with:
          path: .media-runtime-cache/downloads
          key: media-sources-${{ hashFiles('runtime-source-lock.json') }}
      - run: node scripts/portable-runtime.mjs build ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ matrix.target }}
          path: |
            .media-runtime-cache/**/*.log
            .media-runtime-cache/**/config.log
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: resources/ffmpeg/${{ matrix.target }}
          if-no-files-found: error
  portable:
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-2022
            exe: .exe
          - target: linux
            runner: ubuntu-22.04
            exe: ''
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: resources/ffmpeg/${{ matrix.target }}
      - name: Certify relocated media runtime on native OS
        run: node scripts/portable-runtime.mjs certify ${{ matrix.target }}
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run test:src && npm run build
      - run: cargo test --locked --manifest-path service/Cargo.toml && cargo build --locked --release --manifest-path service/Cargo.toml
        env:
          RUSTFLAGS: ${{ matrix.target == 'windows' && '-C target-feature=+crt-static' || '' }}
      - name: Stage native sidecar
        run: |
          mkdir -p bin
          cp service/target/release/concatd${{ matrix.exe }} bin/concatd-${{ matrix.target }}${{ matrix.exe }}
          chmod +x bin/concatd-* resources/ffmpeg/${{ matrix.target }}/ffmpeg* resources/ffmpeg/${{ matrix.target }}/ffprobe*
      - run: npm run smoke
      - run: node scripts/pack-plugin.mjs --platforms ${{ matrix.target }} --per-platform
      - run: node scripts/verify-plugin.mjs dist-pack/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist-pack/${{ matrix.target }}
          if-no-files-found: error
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run test:src && npm run build
      - run: cargo test --locked --manifest-path service/Cargo.toml && cargo build --locked --release --manifest-path service/Cargo.toml
      - run: mkdir -p bin && cp service/target/release/concatd bin/concatd-macos && chmod +x bin/concatd-macos
      - uses: actions/cache@v4
        with:
          path: resources/ffmpeg/macos
          key: macos-runtime-${{ hashFiles('runtime-source-lock.json', 'scripts/build-media-runtime.mjs', 'scripts/verify-media-runtime.mjs') }}
      - name: Build locked macOS runtime if absent
        run: test -f resources/ffmpeg/macos/runtime.json || node scripts/build-media-runtime.mjs --jobs 4
      - run: node scripts/verify-media-runtime.mjs
      - run: npm run smoke
      - run: node scripts/pack-plugin.mjs --platforms macos --per-platform
      - run: node scripts/verify-plugin.mjs dist-pack/macos
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist-pack/macos
          if-no-files-found: error
  publish:
    needs: [portable, macos]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.publish_market && inputs.release_tag != '') }}
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
      - name: Verify all platform packages
        run: |
          for platform in macos windows linux; do
            node scripts/verify-plugin.mjs "release-assets/package-$platform"
          done
      - name: Publish verified release and market entry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          AUTH_MODE: pat
          XYCLOUD_PAT: ${{ secrets.XYCLOUD_PAT }}
          PLATFORM_PACKAGES: 'true'
          PLUGIN_MANIFEST: release-assets/package-macos/plugin.json
          PACK_META: release-assets/meta.json
        run: |
          export RELEASE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('plugin.json','utf8')).version")"
          export COMMIT_SHA="$(git rev-parse HEAD)"
          node scripts/publish-market.mjs preflight
          node scripts/release-policy.mjs
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('release-assets/meta.json',JSON.stringify({platforms:['macos','windows','linux']}));"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Concat v$RELEASE_VERSION" --notes-file docs/RELEASE.md
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          gh release upload "$RELEASE_TAG" release-assets/package-*/*.oplg --clobber
          node scripts/publish-market.mjs
