[package]
name = "otools-concat-service"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[[bin]]
name = "concatd"
path = "src/main.rs"

[lib]
name = "otools_concat_service"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
